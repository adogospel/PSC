services:
  mongodb:
    image: mongo:8
    container_name: psc-mongodb
    restart: unless-stopped

    ports:
      - "27019:27017"

    environment:
      MONGO_INITDB_DATABASE: prier_sans_cesse

    volumes:
      - psc_mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  psc_mongo_data: